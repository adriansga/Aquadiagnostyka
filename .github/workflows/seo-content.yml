name: SEO/GEO content autopilot

on:
  schedule:
    # pon/śr/pt 06:00 UTC = 08:00 czasu polskiego (lato).
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard przed generowaniem
        run: python seo/seo_guard.py

      - name: Generuj artykul B2C
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python seo/auto_article.py

      - name: Guard po generowaniu
        run: python seo/seo_guard.py

      - name: Commit i push tylko plikow SEO
        run: |
          git config user.name "AquaDiagnostyka Bot"
          git config user.email "bot@aquadiagnostyka.pl"
          if [ -n "$(git status --porcelain)" ]; then
            git add seo/topics.md sitemap.xml poradnik.html poradnik-*.html
            git diff --cached --check
            if [ -n "$(git diff --cached --name-only)" ]; then
              git commit -m "feat(content): auto artykul SEO/GEO B2C"
              git push
            else
              echo "Brak zmian SEO do commita."
            fi
          else
            echo "Brak zmian — kolejka tematow pusta."
          fi
